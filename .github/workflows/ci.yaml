name: Docker Image CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  # Allow manual runs from the Actions UI for quick retries / debugging
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Show runner and Docker info (debug)
      run: |
        echo "--- runner info ---"
        uname -a
        cat /etc/os-release || true
        echo "--- docker version ---"
        docker --version || true
        echo "--- docker info (may require permissions) ---"
        docker info || true
        echo "--- workspace files ---"
        ls -la
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag myapp:$(date +%s)
