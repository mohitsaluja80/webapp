<!DOCTYPE html>
<html>
    
<head>

 <!-- Favicons -->
 <link href="static/assets/img/favicon.png" rel="icon">
 <link href="static/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

 <!-- Google Fonts -->

 <!-- Vendor CSS Files -->

 <link href="{% static '/assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">

 <!-- Variables CSS Files. Uncomment your preferred color scheme -->
 <link href="{% static '/assets/css/variables.css' %}" rel="stylesheet">

 <!-- <link href="assets/css/variables-green.css" rel="stylesheet"> -->
 <!-- <link href="assets/css/variables-orange.css" rel="stylesheet"> -->

 <!-- <link href="assets/css/variables-pink.css" rel="stylesheet"> -->

 <!-- Template Main CSS File -->
 <link href="{% static '/assets/css/main.css' %}" rel="stylesheet">






	<title>Login</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">

	<style>
		body,
		html {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #272727 !important;
		}
		.user_card {
			width: 350px;
			margin-top: auto;
			margin-bottom: auto;
			background: #0bb2d3;
			position: relative;
			display: flex;
			justify-content: center;
			flex-direction: column;
			padding: 10px;
			box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			-webkit-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			-moz-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
			border-radius: 5px;

		}

		.form_container {
			margin-top: 20px;
		}

		#form-title{
			color: #fff;
		}
		.login_btn {
			/* width: 100%;
			background: #0dcaf0 !important;
			color: white !important; */
			position: fixed;
			visibility: hidden;
			opacity: 0;
			right: 15px;
			bottom: 15px;
			z-index: 995;
			background: var(--color-primary);
			width: 40px;
			height: 40px;
			border-radius: 4px;
			transition: all 0.4s;
		}
		.login_btn:focus {
			box-shadow: none !important;
			outline: 0px !important;
		}
		.login_container {
			padding: 0 2rem;
		}
		.input-group-text {
			background: #f7ba5b !important;
			color: white !important;
			border: 0 !important;
			border-radius: 0.25rem 0 0 0.25rem !important;
		}
		.input_user,
		.input_pass:focus {
			box-shadow: none !important;
			outline: 0px !important;
		}

	</style>

</head>
<body>
	<div class="container h-100">
		<div class="d-flex justify-content-center h-100">
			<div class="user_card">
				<div class="d-flex justify-content-center">
					<h3 id="form-title">Reset Password</h3>
				</div>
				<div class="d-flex justify-content-center form_container">

					<form method="POST" action="">
						{% csrf_token %}
					
						<div class="input-group mb-2">
							<div class="input-group-append">
								<span class="input-group-text"><i class="fas fa-envelope-square"></i></span>
							</div>
							{{ form.email }}
						</div>
					
				   		<div class="d-flex justify-content-center mt-3 login_container">
				 			<input  type="submit" value="Submit">
							 <!-- <a class="btn-getstarted " href="{% url 'logout' %}">Register</a> -->
 
				   		</div>

					</form>
				</div>
				{% for message in messages %}
                <p id="message">{{ message }}</p>

                {% endfor %}
               
				<div class="mt-4">
					<div class="d-flex justify-content-center links">
						Enter your registered email <a href="{% url 'loginpage' %}" class="ml-2"></a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
						/* Because i didnt set placeholder values in forms.py they will be set here using vanilla Javascript
		//We start indexing at one because CSRF_token is considered and input field 
		 */

		// //Query All input fields
		var form_fields = document.getElementsByTagName('input')

		form_fields[2].placeholder='Email..';
	


		for (var field in form_fields){	
			form_fields[field].className += ' form-control'
		}	
	</script>
</body>
</html>
