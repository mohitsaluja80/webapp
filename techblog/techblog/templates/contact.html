<!-- contact.html -->

<!DOCTYPE html>

<html>

<head>

    <title>Contact Us</title>

</head>

<body>

    <h1>Contact Us</h1>

    {% if messages %}

        {% for message in messages %}

            <p{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>

        {% endfor %}

    {% endif %}

    <form method="post" novalidate>

        {% csrf_token %}

        {{ contact_form.as_p }}

        <button type="submit">Send</button>

    </form>

</body>

</html>
