{% extends 'base.html' %}
{% load static %}

{% block "content" %}
<main id="main">
  <section class="section">
    <div class="container">
      <h2>Edit Post: {{ post.title }}</h2>
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
      <a href="{% url 'blog_detail' post.id %}" class="btn btn-secondary">Cancel</a>
    </div>
  </section>
</main>
{% endblock %}
