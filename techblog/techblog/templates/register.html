<style>

.register-btn {
            width: 100%;
            background: #007bff;
            color: white;
        }
.input-group {
    display: flex;
    align-items: center;
    gap: 10px; /* Space between label and input */
    margin-bottom: 15px;
}

.input-group label {
    width: 120px; /* Fixed width for alignment */
    text-align: left; /* Align label text to the right */
    font-size: 14px;
    font-weight: bold;
}

.input-group input {
    flex: 1; /* Makes input take the remaining space */
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

body, html {
    height: 100%;
    margin: 0;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-card {
    width: 400px;
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.input-group {
    display: flex;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 10px;
    background: white;
}

.input-group i {
    font-size: 18px;
    margin-right: 8px;
    color: #007bff;
}

.input-group input {
    border: none;
    outline: none;
    width: 100%;
    padding: 5px;
    font-size: 16px;
}


.register-btn:hover {
    background: #0056b3;
}
</style>
    
</head>

    <div class="login-card">
        <h2 class="login-title">Create Account</h2>
    
        <form method="POST">
            {% csrf_token %}
    
            <div class="input-group">
                <i class="fas fa-user"></i>
                <label for="{{ form.username.id_for_label }}">Username</label>
              
                {{ form.username }}
            </div>
    
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <label for="{{ form.email.id_for_label }}">Email</label>
               
                {{ form.email }}
            </div>
    
            <div class="input-group">
                <i class="fas fa-key"></i>
                <label for="{{ form.password1.id_for_label }}">Password</label>
               
                {{ form.password1 }}
            </div>
    
            <div class="input-group">
                <i class="fas fa-key"></i>
                <label for="{{ form.password2.id_for_label }}">Confirm Password</label>
                
                {{ form.password2 }}
            </div>
    
            <button class="btn register-btn" type="submit">Register</button>
            <p>Already have an account? <a href="#">Login</a></p>
        </form>
    </div>
</body>
