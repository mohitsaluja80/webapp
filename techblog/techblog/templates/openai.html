<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>
</head>

<style>
  body {
    background-color: #2b2b2b;
    color: white ;
  }

  #story {
    margin-top: 50px;
  }

  .row {
    padding: 10;
    text-align: center;
  }

#Powerdby {
  text-align: right;
  

  }

  #header 
  {
    position: fixed;
    background-color:  #2b2b2b ;

  }


</style>



<div class="container">

  <div class="row fixed-top", id="header">
    <h2> Open AI </h2>
</div>


<form action="" method="POST" name="query">

    {% csrf_token %}
    <div class="row">
      <textarea id="story" name="query" rows="3" cols="33" placeholder="Type your query here.."></textarea>
    </div>
    <div class="row">
    <div class="col-1 p-0 order-1"><button class="btn btn-primary bg-black " type="submit">submit</button></div>
    <div class="col-11 p-0 order-2 m-lg-auto" id="Powerdby"><h6>Powerd by OpenAI</h6> </div>
  </div>
  
  
</form>

<div class="row">
    <textarea id="story" name="response" rows="10" cols="33">{{ openai }}</textarea>
</div>

<div class="row" id="row">
    <h4>Past results</h4>
</div>

<div class="row">
    {% for item in lastfive %}
    <div class="card border-1 bg-secondary-subtle" id="card">
      <img class="card-img-top" alt="">
    <div class="card-body">
        <h4 class="card-title">{{ item.query }}</h4>
        <p class="card-text"> {{ item.response }}</p>
    </div>
</div>

<div class="card-columns">
      <div class="col-sm">
        <h3> </h3>
      </div>
</div>


<div class="col-sm">

</div>


<h4> </h4>
    </col-3>

{% endfor %}
</div>

</div>

</div>

</div>
</body>

<script>
  function myFunction() {
    // Get the text field
    var copyText = document.getElementById("story");

    // Select the text field
    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile devices

    // Copy the text inside the text field
    navigator.clipboard.writeText(copyText.value);

    // Alert the copied text
    alert("Copied the text: " + copyText.value());
  }
</script>
